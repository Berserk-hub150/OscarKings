name: Bundle Stockfish 19
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bundle-stockfish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and bundle the upstream engine
        shell: bash
        run: |
          set -euo pipefail
          asset=engine/stockfish-19-single.wasm
          digest=8725c26572762617fd96b2ea83ff130e6640b85815890d682bf8c49db0820721
          if [[ ! -f "$asset" ]]; then
            curl --fail --location --retry 3 --output "$asset" https://github.com/nmrugg/stockfish.js/releases/download/v19.0.0/stockfish-19-single.wasm
          fi
          echo "$digest  $asset" | sha256sum --check
          git add -- "$asset"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Bundle verified Stockfish 19 single-threaded engine'
            git push origin HEAD:main
          fi
